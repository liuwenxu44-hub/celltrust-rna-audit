[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "celltrust-rna-audit"
version = "0.2.0"
description = "Research source code for auditing RNA-only CITE-seq representation workflows"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

